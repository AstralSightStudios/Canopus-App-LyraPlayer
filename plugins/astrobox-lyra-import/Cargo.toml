[workspace]

[package]
name = "astrobox-plugin-lyra-import"
version = "0.7.3"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63.0", features = ["async", "async-spawn"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lyra-protocol = { path = "../../crates/lyra-protocol" }
lyra-transfer = { path = "../../crates/lyra-transfer" }
mp3-duration = "0.1"
rusty_mp3 = "1.0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tracing = "0.1"
tracing-subscriber = "0.3"
