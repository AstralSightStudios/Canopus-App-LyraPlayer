[workspace]

[package]
name = "astrobox-plugin-lyra-import"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.47.0", features = ["async", "async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crc32fast = "1"
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
md-5 = "0.10"
waki = "0.5.1"
tracing = "0.1"
tracing-subscriber = "0.3"
